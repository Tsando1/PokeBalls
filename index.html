<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardmarket Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <!-- LOGIN / REGISTRAZIONE -->
    <div id="auth-box"
        class="max-w-md mx-auto mt-16 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl hidden">
        <h1 class="text-2xl font-bold mb-2">Cardmarket Tracker</h1>
        <p class="text-sm text-slate-400 mb-6">Accedi o crea un account gratuito con la tua email.</p>
        <input id="email" type="email" placeholder="La tua email"
            class="w-full mb-3 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        <input id="password" type="password" placeholder="Password (min. 6 caratteri)"
            class="w-full mb-4 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        <div class="flex gap-3">
            <button id="btn-login"
                class="flex-1 bg-sky-600 hover:bg-sky-500 font-semibold py-2 rounded-lg text-sm">Accedi</button>
            <button id="btn-register"
                class="flex-1 bg-slate-700 hover:bg-slate-600 font-semibold py-2 rounded-lg text-sm">Registrati</button>
        </div>
        <p id="auth-error" class="text-rose-400 text-xs mt-3"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="app-box" class="max-w-5xl mx-auto hidden">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold">Cardmarket Tracker</h1>
                <p id="user-email" class="text-xs text-slate-400"></p>
            </div>
            <button id="btn-logout" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs">Esci</button>
        </div>

        <form id="add-form"
            class="bg-slate-900 border border-slate-800 p-4 rounded-xl mb-8 grid grid-cols-1 md:grid-cols-12 gap-3">
            <input id="base-url" required placeholder="Link Cardmarket (Carta Singola o Prodotto Sealed)"
                class="md:col-span-5 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
            <select id="lang-id"
                class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="5">Italiano</option>
                <option value="1">Inglese</option>
                <option value="7">Giapponese</option>
                <option value="2">Francese</option>
                <option value="3">Tedesco</option>
                <option value="4">Spagnolo</option>
                <option value="10">Coreano</option>
            </select>
            <input id="target-price" type="number" step="0.01" required placeholder="Soglia € (es. 20)"
                class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
            <input id="discord-webhook" placeholder="Discord Webhook URL"
                class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
            <button type="submit"
                class="md:col-span-1 bg-sky-600 hover:bg-sky-500 font-semibold rounded-lg px-3 py-2 text-sm">Salva</button>
        </form>

        <div id="items-list" class="space-y-6"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        // SOSTITUISCI QUI CON IL TUO FIREBASE CONFIG PRESO ALLO STEP 1
        const firebaseConfig = {
            apiKey: "AIzaSyB7Dehug4VBXqSuf1qBgQ7T5d6-8c0bB2c",
            authDomain: "pokeballs-f209f.firebaseapp.com",
            projectId: "pokeballs-f209f",
            storageBucket: "pokeballs-f209f.firebasestorage.app",
            messagingSenderId: "1072557718436",
            appId: "1:1072557718436:web:d617c426be28f32c1edf31"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const LANG_NAMES = { "1": "EN", "2": "FR", "3": "DE", "4": "ES", "5": "IT", "7": "JP", "10": "KR" };
        const charts = {};

        const webhookInput = document.getElementById("discord-webhook");
        webhookInput.value = localStorage.getItem("discordWebhook") || "";

        document.getElementById("btn-login").onclick = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
            } catch (e) { document.getElementById("auth-error").innerText = e.message; }
        };

        document.getElementById("btn-register").onclick = async () => {
            try {
                await createUserWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
            } catch (e) { document.getElementById("auth-error").innerText = e.message; }
        };

        document.getElementById("btn-logout").onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                document.getElementById("auth-box").classList.remove("hidden");
                document.getElementById("app-box").classList.add("hidden");
                return;
            }
            document.getElementById("auth-box").classList.add("hidden");
            document.getElementById("app-box").classList.remove("hidden");
            document.getElementById("user-email").innerText = "Loggato come: " + user.email;

            document.getElementById("add-form").onsubmit = async (e) => {
                e.preventDefault();
                const webhook = webhookInput.value.trim();
                localStorage.setItem("discordWebhook", webhook);
                const baseUrl = document.getElementById("base-url").value.trim();
                await addDoc(collection(db, "items"), {
                    userId: user.uid,
                    baseUrl: baseUrl,
                    langId: document.getElementById("lang-id").value,
                    targetPrice: parseFloat(document.getElementById("target-price").value),
                    discordWebhook: webhook,
                    isSealed: !baseUrl.includes("/Singles/"),
                    name: "Caricamento (attendi prossimo controllo orario)...",
                    history: []
                });
                document.getElementById("base-url").value = "";
            };

            const q = query(collection(db, "items"), where("userId", "==", user.uid));
            onSnapshot(q, (snap) => {
                const container = document.getElementById("items-list");
                container.innerHTML = "";
                snap.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;
                    const badge = item.isSealed ? "SEALED" : "NEAR MINT";
                    const top10Html = (item.top10Offers || []).map((p, idx) =>
                        `<span class="px-2 py-0.5 rounded text-xs ${idx === 0 ? 'bg-emerald-900/70 text-emerald-300 font-bold' : 'bg-slate-800 text-slate-300'}">#${idx + 1}: ${p.toFixed(2)}€</span>`
                    ).join(" ");

                    const card = document.createElement("div");
                    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col lg:flex-row gap-6";
                    card.innerHTML = `
            <img src="${item.imageUrl || 'https://placehold.co/120x168/1e293b/64748b?text=Card'}" class="w-28 h-40 object-contain rounded-lg bg-slate-950 mx-auto lg:mx-0" />
            <div class="flex-1">
              <div class="flex justify-between items-start gap-2">
                <div>
                  <a href="${item.baseUrl}" target="_blank" class="text-lg font-bold text-sky-400 hover:underline">${item.name}</a>
                  <div class="text-xs text-slate-400 mt-1">
                    Lingua: <b class="text-white">${LANG_NAMES[item.langId] || item.langId}</b> • 
                    Specifica: <b class="text-amber-400">${badge}</b> • 
                    Soglia Alert: <b class="text-rose-400">${Number(item.targetPrice).toFixed(2)} €</b> • 
                    Ultimo check: ${item.lastUpdated || 'In attesa'}
                  </div>
                </div>
                <button data-del="${id}" class="bg-rose-950 hover:bg-rose-800 text-rose-200 text-xs px-3 py-1.5 rounded-lg">Elimina</button>
              </div>

              <div class="grid grid-cols-3 gap-3 my-4">
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                  <div class="text-xs text-slate-400">1ª Offerta Ora</div>
                  <div class="text-xl font-bold text-emerald-400">${item.currentMinPrice ? item.currentMinPrice.toFixed(2) + ' €' : 'N/D'}</div>
                </div>
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                  <div class="text-xs text-slate-400">Minimo Oggi (${item.dailyMinDate || '-'})</div>
                  <div class="text-xl font-bold text-amber-400">${item.dailyMinPrice ? item.dailyMinPrice.toFixed(2) + ' €' : 'N/D'}</div>
                </div>
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                  <div class="text-xs text-slate-400">Media Top 10 Ora</div>
                  <div class="text-xl font-bold text-indigo-400">${item.currentAvgTop10 ? item.currentAvgTop10.toFixed(2) + ' €' : 'N/D'}</div>
                </div>
              </div>

              <div class="flex flex-wrap gap-1.5 mb-4">${top10Html}</div>
              <div class="h-40"><canvas id="chart-${id}"></canvas></div>
            </div>
          `;
                    container.appendChild(card);

                    card.querySelector("[data-del]").onclick = () => deleteDoc(doc(db, "items", id));

                    const hist = item.dailyHistory || [];
if (charts[id]) charts[id].destroy();
charts[id] = new Chart(document.getElementById(`chart-${id}`), {
  type: "line",
  data: {
    labels: hist.map(h => h.d),
    datasets: [
      {
        label: "Minimo Giornaliero (€)",
        data: hist.map(h => h.min),
        borderColor: "#fbbf24",
        backgroundColor: "rgba(251, 191, 36, 0.15)",
        fill: true,
        tension: 0.25
      }
    ]
  },
  options: { responsive: true, maintainAspectRatio: false }
});
                });
            });
        });
    </script>
</body>

</html>
