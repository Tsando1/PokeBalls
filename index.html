<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardmarket Cloud Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <!-- LOGIN / REGISTRAZIONE -->
    <div id="auth-box"
        class="max-w-md mx-auto mt-16 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl hidden">
        <h1 class="text-2xl font-bold mb-2">Cardmarket Tracker</h1>
        <p class="text-sm text-slate-400 mb-6">Accedi o crea un account gratuito con la tua email.</p>
        <input id="email" type="email" placeholder="La tua email"
            class="w-full mb-3 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
        <input id="password" type="password" placeholder="Password (min. 6 caratteri)"
            class="w-full mb-4 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
        <div class="flex gap-3">
            <button id="btn-login"
                class="flex-1 bg-sky-600 hover:bg-sky-500 font-semibold py-2 rounded-lg text-sm transition">Accedi</button>
            <button id="btn-register"
                class="flex-1 bg-slate-700 hover:bg-slate-600 font-semibold py-2 rounded-lg text-sm transition">Registrati</button>
        </div>
        <p id="auth-error" class="text-rose-400 text-xs mt-3"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="app-box" class="max-w-5xl mx-auto hidden">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold">Cardmarket Tracker</h1>
                <p id="user-email" class="text-xs text-slate-400"></p>
            </div>
            <button id="btn-logout" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs transition">Esci</button>
        </div>

        <form id="add-form"
            class="bg-slate-900 border border-slate-800 p-4 rounded-xl mb-8 grid grid-cols-1 md:grid-cols-12 gap-3">
            <input id="base-url" required placeholder="Link Cardmarket (Singola o Prodotto Sealed)"
                class="md:col-span-5 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
            <select id="lang-id"
                class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                <option value="5">Italiano</option>
                <option value="1">Inglese</option>
                <option value="7">Giapponese</option>
                <option value="2">Francese</option>
                <option value="3">Tedesco</option>
                <option value="4">Spagnolo</option>
                <option value="10">Coreano</option>
            </select>
            <input id="target-price" type="number" step="0.01" required placeholder="Soglia € (es. 20)"
                class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
            <input id="discord-webhook" placeholder="Discord Webhook URL"
                class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
            <button type="submit"
                class="md:col-span-1 bg-sky-600 hover:bg-sky-500 font-semibold rounded-lg px-3 py-2 text-sm transition">Salva</button>
        </form>

        <div id="items-list" class="space-y-6"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7Dehug4VBXqSuf1qBgQ7T5d6-8c0bB2c",
            authDomain: "pokeballs-f209f.firebaseapp.com",
            projectId: "pokeballs-f209f",
            storageBucket: "pokeballs-f209f.firebasestorage.app",
            messagingSenderId: "1072557718436",
            appId: "1:1072557718436:web:d617c426be28f32c1edf31"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const LANG_NAMES = { "1": "EN", "2": "FR", "3": "DE", "4": "ES", "5": "IT", "7": "JP", "10": "KR" };
        const charts = {};

        const webhookInput = document.getElementById("discord-webhook");
        webhookInput.value = localStorage.getItem("discordWebhook") || "";

        document.getElementById("btn-login").onclick = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
            } catch (e) { document.getElementById("auth-error").innerText = e.message; }
        };

        document.getElementById("btn-register").onclick = async () => {
            try {
                await createUserWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
            } catch (e) { document.getElementById("auth-error").innerText = e.message; }
        };

        document.getElementById("btn-logout").onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                document.getElementById("auth-box").classList.remove("hidden");
                document.getElementById("app-box").classList.add("hidden");
                return;
            }
            document.getElementById("auth-box").classList.add("hidden");
            document.getElementById("app-box").classList.remove("hidden");
            document.getElementById("user-email").innerText = "Loggato come: " + user.email;

            document.getElementById("add-form").onsubmit = async (e) => {
                e.preventDefault();
                const webhook = webhookInput.value.trim();
                localStorage.setItem("discordWebhook", webhook);
                const baseUrl = document.getElementById("base-url").value.trim();
                const langVal = document.getElementById("lang-id").value;
                const targetPriceVal = parseFloat(document.getElementById("target-price").value);

                await addDoc(collection(db, "items"), {
                    userId: user.uid,
                    baseUrl: baseUrl,
                    url: baseUrl,
                    langId: langVal,
                    language: langVal,
                    targetPrice: targetPriceVal,
                    discordWebhook: webhook,
                    isSealed: !baseUrl.includes("/Singles/"),
                    name: "Caricamento in corso (in attesa del primo controllo)...",
                    title: "Caricamento in corso (in attesa del primo controllo)...",
                    dailyHistory: []
                });
                document.getElementById("base-url").value = "";
            };

            const q = query(collection(db, "items"), where("userId", "==", user.uid));
            onSnapshot(q, (snap) => {
                const container = document.getElementById("items-list");
                container.innerHTML = "";
                snap.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;
                    const badge = item.isSealed ? "SEALED" : "NEAR MINT";
                    const top10Html = (item.top10Offers || []).map((p, idx) => {
                        const priceVal = typeof p === 'number' ? p : (p && p.price != null ? p.price : Number(p) || 0);
                        return `<span class="px-2 py-0.5 rounded text-xs ${idx === 0 ? 'bg-emerald-900/70 text-emerald-300 font-bold' : 'bg-slate-800 text-slate-300'}">#${idx + 1}: ${priceVal.toFixed(2)}€</span>`;
                    }).join(" ");

                    const card = document.createElement("div");
                    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col lg:flex-row gap-6";
                    card.innerHTML = `
            <img src="${item.imageUrl || 'https://placehold.co/120x168/1e293b/64748b?text=Card'}" class="w-28 h-40 object-contain rounded-lg bg-slate-950 mx-auto lg:mx-0" />
            <div class="flex-1">
              <div class="flex justify-between items-start gap-2">
                <div>
                  <a href="${item.baseUrl || item.url}" target="_blank" class="text-lg font-bold text-sky-400 hover:underline">${item.name || item.title || 'Prodotto Cardmarket'}</a>
                  <div class="text-xs text-slate-400 mt-1">
                    Lingua: <b class="text-white">${LANG_NAMES[item.langId] || LANG_NAMES[item.language] || item.langId || item.language || 'N/D'}</b> • 
                    Specifica: <b class="text-amber-400">${badge}</b> • 
                    Soglia Alert: <b class="text-rose-400">${Number(item.targetPrice || 0).toFixed(2)} €</b> • 
                    Ultimo check: ${item.lastUpdated || item.lastChecked || 'In attesa'}
                  </div>
                </div>
                <button data-del="${id}" class="bg-rose-950 hover:bg-rose-800 text-rose-200 text-xs px-3 py-1.5 rounded-lg transition">Elimina</button>
              </div>

              <div class="grid grid-cols-3 gap-3 my-4">
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                  <div class="text-xs text-slate-400">1ª Offerta Ora</div>
                  <div class="text-xl font-bold text-emerald-400">${item.currentMinPrice != null ? item.currentMinPrice.toFixed(2) + ' €' : (item.currentLowest != null ? item.currentLowest.toFixed(2) + ' €' : 'N/D')}</div>
                </div>
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                  <div class="text-xs text-slate-400">Minimo Oggi (${item.dailyMinDate || '-'})</div>
                  <div class="text-xl font-bold text-amber-400">${item.dailyMinPrice != null ? item.dailyMinPrice.toFixed(2) + ' €' : 'N/D'}</div>
                </div>
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                  <div class="text-xs text-slate-400">Media Top 10 Ora</div>
                  <div class="text-xl font-bold text-indigo-400">${item.currentAvgTop10 != null ? item.currentAvgTop10.toFixed(2) + ' €' : 'N/D'}</div>
                </div>
              </div>

              <div class="flex flex-wrap gap-1.5 mb-4">${top10Html}</div>

              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-slate-400">Andamento Prezzo</span>
                <div class="flex gap-1 text-xs">
                  <button id="btn-mode-hourly-${id}" class="px-2 py-0.5 rounded bg-sky-700 text-sky-100 font-semibold transition">Orario (Ultime 24h)</button>
                  <button id="btn-mode-daily-${id}" class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 hover:text-white transition">Storico Giornaliero</button>
                </div>
              </div>

              <div class="h-44"><canvas id="chart-${id}"></canvas></div>
            </div>
          `;
                    container.appendChild(card);

                    card.querySelector("[data-del]").onclick = () => deleteDoc(doc(db, "items", id));

                    const hourlyData = item.hourlyHistory || [];
                    let dailyData = item.dailyHistory || [];
                    if (!Array.isArray(dailyData)) {
                        dailyData = Object.entries(dailyData).map(([d, min]) => ({ d, min: Number(min) || 0 }));
                    }

                    const renderChart = (mode) => {
                        if (charts[id]) charts[id].destroy();

                        const isHourly = mode === "hourly";
                        const source = isHourly ? hourlyData : dailyData;
                        const labels = isHourly ? source.map(h => h.t) : source.map(h => h.d);
                        const points = isHourly ? source.map(h => h.p) : source.map(h => h.min);
                        const labelTitle = isHourly ? "Prezzo Rilevato (€)" : "Minimo Giornaliero (€)";
                        const color = isHourly ? "#38bdf8" : "#fbbf24";
                        const bgColor = isHourly ? "rgba(56, 189, 248, 0.15)" : "rgba(251, 191, 36, 0.15)";

                        const ctx = document.getElementById(`chart-${id}`);
                        if (!ctx) return;

                        charts[id] = new Chart(ctx, {
                            type: "line",
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: labelTitle,
                                    data: points,
                                    borderColor: color,
                                    backgroundColor: bgColor,
                                    fill: true,
                                    tension: 0.25
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    x: { ticks: { maxTicksLimit: 8, font: { size: 10 } } },
                                    y: { ticks: { callback: v => v + ' €', font: { size: 10 } } }
                                }
                            }
                        });

                        const bH = document.getElementById(`btn-mode-hourly-${id}`);
                        const bD = document.getElementById(`btn-mode-daily-${id}`);
                        if (bH && bD) {
                            if (isHourly) {
                                bH.className = "px-2 py-0.5 rounded bg-sky-700 text-sky-100 font-semibold transition";
                                bD.className = "px-2 py-0.5 rounded bg-slate-800 text-slate-400 hover:text-white transition";
                            } else {
                                bD.className = "px-2 py-0.5 rounded bg-amber-700 text-amber-100 font-semibold transition";
                                bH.className = "px-2 py-0.5 rounded bg-slate-800 text-slate-400 hover:text-white transition";
                            }
                        }
                    };

                    const defaultMode = hourlyData.length > 0 ? "hourly" : "daily";
                    renderChart(defaultMode);

                    const bH = document.getElementById(`btn-mode-hourly-${id}`);
                    const bD = document.getElementById(`btn-mode-daily-${id}`);
                    if (bH) bH.onclick = () => renderChart("hourly");
                    if (bD) bD.onclick = () => renderChart("daily");
                });
            });
        });
    </script>
</body>

</html>
