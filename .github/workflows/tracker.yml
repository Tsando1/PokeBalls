name: Cardmarket Cloud Tracker

on:
  schedule:
    # Esegue il controllo automatico ogni 5 minuti 24/7 (massima frequenza assoluta)
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Permette di avviare il controllo manualmente con un click da GitHub!

jobs:
  track-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa Chrome e Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Installa le dipendenze Python
        run: |
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Esegui il Tracker Cardmarket (Controllo 5 minuti)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tracker.py
